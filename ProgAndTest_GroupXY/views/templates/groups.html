{% extends "base.html" %}
{% block content %}
<div style="max-width: 600px; margin: 0 auto;">
    <h3 class="text-center fw-bold mb-4">GROUP MANAGEMENT</h3>
    {% for g in groups %}
    <div class="d-flex align-items-center justify-content-between py-2 border-bottom">
        <div class="fw-bold">{{ g.groupName }} ({{ g.memberCount }})</div>
        <div class="d-flex gap-2">
            <button class="btn btn-sm btn-light text-primary fw-bold border" data-bs-toggle="modal" data-bs-target="#editGroup{{ g.groupID }}">Edit</button>
            <form method="post" action="/groups/{{ g.groupID }}/delete" onsubmit="return confirm('Delete this group? Contacts will NOT be deleted.');">
                <button type="submit" class="btn btn-sm btn-light text-danger fw-bold border">Delete</button>
            </form>
        </div>
    </div>

    <!-- Edit Group Modal -->
    <div class="modal fade" id="editGroup{{ g.groupID }}" tabindex="-1">
      <div class="modal-dialog">
        <form class="modal-content" method="post" action="/groups/{{ g.groupID }}/edit">
          <div class="modal-header"><h5 class="modal-title">Edit Group</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
          <div class="modal-body">
            <input type="text" name="groupName" value="{{ g.groupName }}" class="form-control mb-2" required>
            <input type="text" name="description" value="{{ g.description or '' }}" class="form-control" placeholder="Description">
          </div>
          <div class="modal-footer"><button type="submit" class="btn btn-primary">Save</button></div>
        </form>
      </div>
    </div>
    {% else %}
    <p class="text-center text-muted">No groups created yet.</p>
    {% endfor %}

    <div class="text-center mt-4">
        <button class="btn btn-primary rounded-pill px-4 fw-bold" data-bs-toggle="modal" data-bs-target="#addGroupModal">Add New Group (+)</button>
    </div>
</div>

<!-- Add Group Modal -->
<div class="modal fade" id="addGroupModal" tabindex="-1">
  <div class="modal-dialog">
    <form class="modal-content" method="post" action="/groups/add">
      <div class="modal-header"><h5 class="modal-title">Add New Group</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
      <div class="modal-body">
        <input type="text" name="groupName" class="form-control mb-2" placeholder="Group Name (e.g., Family, Work)" required>
        <input type="text" name="description" class="form-control" placeholder="Description (optional)">
      </div>
      <div class="modal-footer"><button type="submit" class="btn btn-primary">Create</button></div>
    </form>
  </div>
</div>
{% endblock %}
