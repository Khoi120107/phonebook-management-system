{% extends "base.html" %}
{% block content %}
<div class="pink-card">
    <h2 class="text-center fw-bold mb-4">RESET PASSWORD</h2>
    <form method="post" action="/reset-password">
        <div class="mb-3">
            <label class="form-label fw-bold">Registered Email</label>
            <input type="email" name="email" class="form-control" required>
        </div>
        <button type="submit" class="btn btn-primary w-100 fw-bold">Generate New Password</button>
    </form>
    <div class="text-center mt-3">
        <a href="/login" class="text-dark">Back to Log in</a>
    </div>
</div>
{% endblock %}
