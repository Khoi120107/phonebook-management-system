{% extends "base.html" %}
{% block content %}
<div class="pink-card">
    <h2 class="text-center fw-bold mb-4">REGISTER</h2>
    <form method="post" action="/register">
        <div class="mb-2">
            <label class="form-label fw-bold">Full Name *</label>
            <input type="text" name="fullName" class="form-control" required>
        </div>
        <div class="mb-2">
            <label class="form-label fw-bold">Email *</label>
            <input type="email" name="email" class="form-control" required>
        </div>
        <div class="mb-2">
            <label class="form-label fw-bold">Phone Number *</label>
            <input type="text" name="phoneNumber" class="form-control" required>
        </div>
        <div class="row mb-2">
            <div class="col">
                <label class="form-label fw-bold">Date of Birth</label>
                <input type="date" name="dateOfBirth" class="form-control">
            </div>
            <div class="col">
                <label class="form-label fw-bold">Gender</label>
                <select name="gender" class="form-select">
                    <option value="">-- Select --</option>
                    <option value="Male">Male</option>
                    <option value="Female">Female</option>
                    <option value="Other">Other</option>
                </select>
            </div>
        </div>
        <div class="mb-2">
            <label class="form-label fw-bold">Address</label>
            <input type="text" name="address" class="form-control">
        </div>
        <div class="mb-2">
            <label class="form-label fw-bold">Password * (min 6 chars)</label>
            <input type="password" name="password" class="form-control" required>
        </div>
        <div class="mb-4">
            <label class="form-label fw-bold">Confirm your password *</label>
            <input type="password" name="confirmPassword" class="form-control" required>
        </div>
        <button type="submit" class="btn btn-primary w-100 fw-bold py-2">Register</button>
    </form>
    <div class="text-center mt-3">
        <a href="/login" class="text-dark">Already have an account? Log in</a>
    </div>
</div>
{% endblock %}
