{% extends "base.html" %}
{% block content %}
<div class="pink-card">
    <h3 class="text-center fw-bold mb-4">PERSONAL INFORMATION</h3>
    <form method="post" action="/profile">
        <div class="mb-2">
            <label class="form-label fw-bold">Full name:</label>
            <input type="text" name="fullName" value="{{ user.fullName }}" class="form-control" required>
        </div>
        <div class="mb-2">
            <label class="form-label fw-bold">Phone number:</label>
            <input type="text" name="phoneNumber" value="{{ user.phoneNumber }}" class="form-control" required>
        </div>
        <div class="mb-2">
            <label class="form-label fw-bold">Email (Read-only):</label>
            <input type="email" value="{{ user.email }}" class="form-control" disabled>
        </div>
        <div class="row mb-2">
            <div class="col">
                <label class="form-label fw-bold">Date of Birth:</label>
                <input type="date" name="dateOfBirth" value="{{ user.dateOfBirth or '' }}" class="form-control">
            </div>
            <div class="col">
                <label class="form-label fw-bold">Gender:</label>
                <input type="text" name="gender" value="{{ user.gender or '' }}" class="form-control">
            </div>
        </div>
        <div class="mb-2">
            <label class="form-label fw-bold">Address:</label>
            <input type="text" name="address" value="{{ user.address or '' }}" class="form-control">
        </div>
        <div class="mb-4">
            <label class="form-label fw-bold">New Password (leave blank to keep current):</label>
            <input type="password" name="password" class="form-control">
        </div>
        <div class="d-flex justify-content-center gap-3">
            <button type="submit" class="btn btn-primary px-4 fw-bold">Update</button>
            <a href="/" class="btn btn-secondary px-4">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
